# brushConverter 验证体系的唯一 pytest 配置文件（仓库根只保留这一个）。
#
# 1) addopts：
#    用 -p 把 tools/verify_entry.py 加载成轻量插件，由它的
#    pytest_collection_modifyitems 钩子给所有被收集的用例自动补上 verify 标记。
#    这样「现有 5 个测试文件全部纳入 verify」不需要逐个文件改代码。
#    注意：这里的 -p 是「加载标记插件」，与 -p no:cacheprovider 这类
#    「屏蔽输出/缓存」的参数无关，不会掩盖任何跳过。
# 2) testpaths：默认只收集 tests/，避免把 docs/ 或临时目录里的示例收集进来。
# 3) markers：三个标记集中注册，避免 PytestUnknownMarkWarning。
[pytest]
addopts = -p tools.verify_entry
testpaths = tests
markers =
    verify: 全量验证入口（= 回归 + 参数级 + 像素级，后续所有比对都必须挂在这个标记下）
    verify_params: 参数级比对（.kpp 参数与 tests/golden 期望值表逐字段核对）
    verify_pixels: 像素级比对（Alpha 通道逐像素差异）
